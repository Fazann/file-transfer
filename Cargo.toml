[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lanshare-core = { path = "crates/lanshare-core" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
hostname = "0.4"
if-addrs = "0.15"
indicatif = "0.18"
mdns-sd = "0.21"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"

# BLAKE3 is far slower without optimizations, which makes debug builds and tests crawl on large files.
[profile.dev.package.blake3]
opt-level = 3
